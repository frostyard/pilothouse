# Dependabot (frostyard/core ADR-0071 row B13). This repository has 4
# ecosystems with a manifest: the actions the workflows pin (github-actions),
# go.mod (gomod), the 3 Containerfiles under .docker, .devcontainer and
# test/image/ucore (docker), and the site's package.json (npm).
# Each entry has 1 group with `patterns: ["*"]`, so it opens at most 1
# version-update PR for each run (frostyard/core ADR-0075). Security
# updates stay ungrouped.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/.docker"
      - "/.devcontainer"
      - "/test/image/ucore"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]

  # The Astro site under site/ is replaced by the B9 docs-site follow-up,
  # which removes this entry together with site/.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]
