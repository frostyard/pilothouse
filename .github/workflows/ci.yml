# The CI workflow (name: Tests, which snapshot.yml follows). The 6 jobs
# together run every target of `make ci`: lint (lint), security (govulncheck),
# unit-test (test), race-test (race), verify (the go.mod tidy diff, vet, the
# gofmt check, the template gate and the corrections check) and build. Each
# job keeps `contents: read` only, and no checkout persists credentials.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      - name: Generate templ
        run: go tool templ generate

      # golangci-lint comes from mise.toml and mise.lock, checksum-verified, so
      # CI runs exactly the release `make lint` checks for.
      - name: Install golangci-lint
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: golangci-lint
          cache: true

      - name: Lint
        run: make lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      - name: Generate templ
        run: go tool templ generate

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      - name: Download dependencies
        run: go mod download

      - name: Generate templ
        run: go tool templ generate

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev

      - name: Run unit tests with coverage
        run: go test -v ./... -coverprofile=coverage.out -covermode=atomic

      - name: Run sdjournal tests
        run: go test -v -tags sdjournal ./internal/modules/logs/journal/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          use_oidc: true
          verbose: true
        continue-on-error: true

  race-test:
    name: Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      - name: Download dependencies
        run: go mod download

      - name: Generate templ
        run: go tool templ generate

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev

      - name: Run tests with race detector
        run: make race

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The corrections check compares .memory/corrections.jsonl with the
          # PR base, which needs the base commit's history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      # Node comes from mise.toml and mise.lock, checksum-verified, for the
      # template gate in `make verify-template`.
      - name: Install Node
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: node
          cache: true

      - name: Generate templ
        run: go tool templ generate

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: make format-check

      - name: Run the template gate
        run: make verify-template

      - name: Check that .memory/corrections.jsonl is append-only
        run: make corrections-base BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      # pilothoused links libpam and libsystemd via cgo. Install headers for the
      # native build, plus the aarch64 cross toolchain and arm64 libraries.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Pin existing repositories to amd64 so apt does not try to fetch
            # arm64 from mirrors that don't serve it (e.g. security.ubuntu.com).
            sudo sed -i 's|^Types: deb|Types: deb\nArchitectures: amd64|' /etc/apt/sources.list.d/ubuntu.sources
            # The ports suite must match the runner's Ubuntu release, or apt
            # mixes amd64 and arm64 package versions.
            codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
            sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libpam0g-dev:arm64 libsystemd-dev:arm64
          fi

      - name: Generate templ
        run: go tool templ generate

      - name: Build binaries
        run: |
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=1
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc CGO_LDFLAGS=-L/usr/lib/aarch64-linux-gnu
          fi
          go build -buildvcs=false -o bin/pilothouse ./cmd/pilothouse
          go build -tags sdjournal -buildvcs=false -o bin/pilothoused ./cmd/pilothoused
          ls -lh bin/
