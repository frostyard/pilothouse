# The CI workflow (name: Tests, which snapshot.yml follows). The 6 jobs
# together run every part of `make ci` as core ADR-0073 (baseline row B12)
# asks, each part as `make <target>`: Verify runs `make verify` (the go.mod
# tidy diff, vet, the gofmt check, lint, the template gate, govulncheck and the
# tests) and `make corrections-base`, Race Detection runs `make race`, and
# Build runs `make build` on linux amd64 and arm64. Lint, Security Scan and
# Unit Tests run lint, govulncheck and the coverage test run on their own (the
# last uploads coverage to Codecov). Each job keeps `contents: read` only, and
# no checkout persists credentials.
# TestCIWorkflowRunsEveryPartOfMakeCI guards this.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Generate templ
        run: go tool templ generate

      # golangci-lint comes from mise.toml and mise.lock, checksum-verified, so
      # CI runs exactly the release `make lint` checks for.
      - name: Install golangci-lint
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: golangci-lint
          cache: true

      - name: Lint
        run: make lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Generate templ
        run: go tool templ generate

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Download dependencies
        run: go mod download

      - name: Generate templ
        run: go tool templ generate

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev

      - name: Run unit tests with coverage
        run: go test -v ./... -coverprofile=coverage.out -covermode=atomic

      - name: Run sdjournal tests
        run: go test -v -tags sdjournal ./internal/modules/logs/journal/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          use_oidc: true
          verbose: true
        continue-on-error: true

  race-test:
    name: Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Download dependencies
        run: go mod download

      - name: Generate templ
        run: go tool templ generate

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev

      - name: Run tests with race detector
        run: make race

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The corrections check compares .memory/corrections/ with the
          # PR base, which needs the base commit's history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      # `make verify` runs every gate, but the lint and template gates need
      # the tools and the tests need the cgo headers.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev

      # golangci-lint and Node come from mise.toml and mise.lock,
      # checksum-verified, for the lint and template gates in `make verify`.
      - name: Install golangci-lint and Node
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: golangci-lint node
          cache: true

      # `make verify` falls back to an unpinned `go run
      # golang.org/x/vuln/cmd/govulncheck@latest` when govulncheck is not on
      # PATH; this keeps CI on the pin the Security Scan job uses.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Generate templ
        run: go tool templ generate

      # The `verify` prerequisite of `make ci`: the tidy diff, vet, the format
      # check, lint, the template gate, govulncheck and the tests. It repeats
      # the Lint, Security Scan and Unit Tests checks on purpose, so that one
      # job runs `make verify` itself, as core ADR-0073 asks.
      - name: Run make verify
        run: make verify

      - name: Check the corrections records against the PR base
        run: make corrections-base BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}

  build:
    name: Build
    # The arm64 cross build takes the ports libraries and the glibc of the
    # runner's release, so this job pins the image instead of ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      # pilothoused links libpam and libsystemd via cgo. Install headers for the
      # native build, plus the aarch64 cross toolchain and arm64 libraries.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Pin existing repositories to amd64 so apt does not try to fetch
            # arm64 from mirrors that don't serve it (e.g. security.ubuntu.com).
            sudo sed -i 's|^Types: deb|Types: deb\nArchitectures: amd64|' /etc/apt/sources.list.d/ubuntu.sources
            # The ports suite must match the runner's Ubuntu release, or apt
            # mixes amd64 and arm64 package versions.
            codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
            sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libpam0g-dev:arm64 libsystemd-dev:arm64
          fi

      - name: Generate templ
        run: go tool templ generate

      # `make build` depends on `generate`, and `go tool templ` builds templ
      # for GOOS/GOARCH, so under the arm64 cross environment it would build an
      # arm64 templ the runner cannot execute. The `Generate templ` step above
      # already ran it natively, and `-o generate` tells make to treat
      # `generate` as up to date (`make -n -o generate build` prints only the
      # two go build lines).
      - name: Build binaries
        run: |
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=1
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc CGO_LDFLAGS=-L/usr/lib/aarch64-linux-gnu
          fi
          make -o generate build
          ls -lh bin/
