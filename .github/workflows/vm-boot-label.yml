# .github/workflows/vm-boot-label.yml
#
# Starts the label-gated heavy tiers when the `vm-boot` label goes on a pull
# request, and does nothing for any other label: the packaging gate
# (.github/workflows/packaging.yml, #263) and the image tier
# (.github/workflows/image-tier.yml, #266).
#
# Why this is its own file: GitHub cannot filter a `pull_request` `labeled`
# trigger by label name. While packaging.yml listed `labeled`, every label
# started a full packaging run. `PR triage` (.github/workflows/risk-paths.yml)
# reads the check runs at the head about 10 seconds after a label, found
# `Build and verify packages` in progress, and removed `ready-for-human` again.
# While image-tier.yml listed `labeled`, every label on a pull request that
# carries `vm-boot` started the 180-minute `ucore-vm` job again. A job `if:` in
# either callee would leave a skipped run as the newest run of the callee's
# check name, which hides an earlier failed run of the same name from a reader
# that counts only the newest run of each check. Here, a label other than
# `vm-boot` skips the caller jobs below. Their check runs carry these jobs'
# own names, they complete at once, and a skipped run counts as green.
#
# A `vm-boot` label runs packaging.yml in full for the pull request's head
# (`packages`, `install` and `vm-boot`) and image-tier.yml's `ucore-vm`; the
# label-presence gates in both callees then hold. Pushes to a labelled pull
# request keep running both callees directly.
name: vm-boot label

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  packaging:
    name: vm-boot packaging
    if: github.event.label.name == 'vm-boot'
    permissions:
      contents: read
    uses: ./.github/workflows/packaging.yml
    secrets:
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  # The image tier needs no repository secret, so this job passes none.
  image-tier:
    name: vm-boot image tier
    if: github.event.label.name == 'vm-boot'
    permissions:
      contents: read
    uses: ./.github/workflows/image-tier.yml
