name: Nightly compliance

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-compliance
  cancel-in-progress: false

jobs:
  compliance:
    name: Credential-free compliance gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpam0g-dev libsystemd-dev

      # golangci-lint comes from mise.toml and mise.lock, checksum-verified,
      # so the nightly run uses exactly the release `make lint` checks for.
      # `make ci` runs with no BASE here: a scheduled run has no pull request
      # base commit to compare .memory/corrections.jsonl with.
      - name: Install golangci-lint and Node
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          install_args: golangci-lint node
          cache: true

      - name: Install compliance tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          golangci-lint version
          govulncheck -version

      - name: Run credential-free CI mirror
        run: make ci
