# .github/workflows/packaging.yml
#
# The packaging gate: it builds the .deb and .rpm artifacts with GoReleaser Pro,
# checks them against the repository's artifact contract, installs those same
# artifacts on pinned Debian and Fedora containers, and — on main and on
# labelled pull requests — boots a real Debian and Fedora VM and validates the
# installed package on a host with systemd as PID 1, so a packaging regression
# fails a pull request instead of shipping.
#
# Why this is its own file, and not a job in .github/workflows/test.yml:
# this job needs the GORELEASER_KEY secret, and GitHub does not hand repository
# secrets to a workflow run triggered by a pull request from a fork. A job
# added to test.yml would therefore fail for every fork contributor, and
# test.yml must stay green for them. Keeping the credential-dependent gate in
# its own file lets that whole file skip on fork pull requests while the rest
# of the gates keep running.
#
# Why this is not .github/workflows/snapshot.yml either: snapshot.yml is a
# publisher, not a gate. It runs after Tests succeeds on main, so it never sees
# a pull request, and it runs `release --nightly --clean`, which publishes the
# rolling `dev` pre-release. This file runs `release --snapshot --clean`, which
# publishes nothing, needs no tag and needs no GITHUB_TOKEN.
#
# That means a push to main builds the packages twice: once here, verified and
# published nowhere, and once in snapshot.yml, unverified and published to the
# `dev` tag. That double build is deliberate. Do not "optimize" it away by
# chaining this workflow to snapshot.yml or by moving verification into the
# publishing path: a gate that runs only after a merge cannot block a pull
# request, and a gate that shares a run with a publisher cannot fail without
# also breaking publication.
name: Packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` is added to the three defaults so applying the `vm-boot` label
    # can start a run. The VM job then gates on the label being PRESENT, not on
    # the event that added it, so a later push to the same pull request runs it
    # again — a label that certified only the commit at HEAD when it was
    # applied would be a worse guarantee than not running at all.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  packages:
    name: Build and verify packages
    runs-on: ubuntu-latest
    # Fork pull requests never receive GORELEASER_KEY, so skip the job for them
    # rather than failing it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      # nfpm's rpm packager shells out to rpm-family tools, so `rpm` is
      # installed explicitly instead of relying on whatever the runner image
      # happens to carry.
      # pilothoused links libpam and libsystemd via cgo, and .goreleaser.yaml
      # builds it for amd64 and arm64, so the aarch64 cross toolchain and the
      # arm64 headers are installed too.
      - name: Install packaging and build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          # Pin the runner's existing repositories to amd64 so apt does not try
          # to fetch arm64 from mirrors that don't serve it (e.g. 404s from
          # security.ubuntu.com).
          sudo sed -i 's|^Types: deb|Types: deb\nArchitectures: amd64|' /etc/apt/sources.list.d/ubuntu.sources
          # Provide arm64 packages from ports.ubuntu.com.
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y rpm gcc-aarch64-linux-gnu libpam0g-dev libsystemd-dev libpam0g-dev:arm64 libsystemd-dev:arm64

      - name: Build packages with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # Each format is asserted on its own, so a build that produced only one of
      # them fails here instead of passing a single glob that matched the other.
      - name: Assert a .deb was built
        run: ls -l dist/*.deb

      - name: Assert an .rpm was built
        run: ls -l dist/*.rpm

      - name: Verify the artifact contract
        run: make verify-packages

      - name: Upload deb packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: packages-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload rpm packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: packages-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # Layer A of package validation: install the artifacts the job above already
  # verified, inside a real distro userland, and assert what the package
  # manager and the postinstall scriptlet actually produced on disk.
  #
  # This job deliberately does NOT restate the fork-skip condition from
  # `packages`. A skipped job skips its dependents, so `needs: packages` makes
  # the skip inherited; restating the `if:` would be a second copy of the same
  # rule, free to drift.
  #
  # It also deliberately does not build anything: it downloads the artifacts
  # `packages` uploaded, so the bytes installed here are the exact bytes the
  # artifact contract already passed, and there is exactly one GoReleaser build
  # in this workflow. Only the matching format's artifact is downloaded, so a
  # format mis-detection cannot silently install the wrong file. The job needs
  # nothing but Docker, which ubuntu-latest provides — no Go, no packaging
  # build dependencies.
  install:
    name: Install packages on target distros
    runs-on: ubuntu-latest
    needs: packages
    strategy:
      # One family's failure must not mask the other's result.
      fail-fast: false
      matrix:
        include:
          - family: debian
            image: debian:12@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
            artifact: packages-deb
          - family: fedora
            image: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
            artifact: packages-rpm
    steps:
      # verify-install.sh and the make target that runs it both come from the
      # tree, not from the artifact.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install and validate inside ${{ matrix.family }}
        run: make verify-package-install INSTALL_IMAGE=${{ matrix.image }} ARTIFACT_DIR=dist

  # Layer B of package validation: install the same artifacts on a BOOTED host
  # with systemd as PID 1 and assert what no container can show — units actually
  # starting, systemd actually creating the runtime and state directories, the
  # broker socket actually live, PAM actually authenticating a real non-root
  # administrator, journald actually reachable through the broker's own journal
  # query, and that posture surviving a real reboot.
  #
  # Like `install`, this job deliberately does NOT restate the fork-skip
  # condition from `packages`: `needs: packages` makes the skip inherited. Its
  # `if:` is the label gate and nothing else.
  #
  # This tier is not a required check. It runs on every push to main, and on a
  # pull request only while the `vm-boot` label is on it.
  #
  # It builds nothing: no GoReleaser step, and only the matching format's
  # artifact is downloaded. It publishes nothing either — no upload-artifact
  # step and no registry push, so the throwaway overlay disk, the NoCloud seed
  # and the run-time credentials never leave the job. Diagnostics (QEMU stderr
  # and the guest serial console) go to the job log instead.
  vm-boot:
    name: Boot ${{ matrix.family }} and validate the installed package
    runs-on: ubuntu-latest
    needs: packages
    # Label PRESENCE, not the labeling event: a subsequent push to a labelled
    # pull request runs this job again.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'vm-boot')
    strategy:
      # One family's failure must not mask the other's result.
      fail-fast: false
      matrix:
        include:
          - family: debian
            artifact: packages-deb
          - family: fedora
            artifact: packages-rpm
    steps:
      # The harness comes from the tree, never from the artifact.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Standard GitHub-hosted runners expose /dev/kvm but not to the job's
      # user. This udev rule is what makes hardware acceleration usable; the
      # harness boots with `-accel kvm` and never falls back to software
      # emulation, so a runner without it fails the job rather than running
      # a slower, different test.
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # qemu-system-x86 boots the guest, qemu-img builds the copy-on-write
      # overlay over the pinned base image, and xorriso writes the NoCloud seed
      # ISO cloud-init reads.
      - name: Install QEMU and cloud-image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso

      - name: Download the built packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: dist

      # The orchestrator is invoked through an EXPLICIT interpreter. It is also
      # committed executable, so neither the file mode nor this `bash` prefix is
      # a single point of failure for the step starting.
      - name: Boot ${{ matrix.family }} and validate on a real host
        run: bash test/vm/vm-boot-test.sh --family ${{ matrix.family }} --artifact-dir dist
