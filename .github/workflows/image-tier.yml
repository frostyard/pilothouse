# Image-based host validation for issue #80. This workflow uses the last
# released x86_64 RPM as its packaging substrate and overlays executables built
# from the checked-out head, so a pull request exercises its own code without a
# branch package. It creates only ephemeral local uCore derivatives and
# publishes or uploads nothing.
name: Image tier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The three defaults, written out, and deliberately NOT `labeled` (#266,
    # the same cause as #263 in packaging.yml). With `labeled` here, every
    # label on a pull request that carries `vm-boot` (for example
    # `ready-for-human`) started the 180-minute `ucore-vm` job again.
    # Applying the `vm-boot` label starts this workflow through
    # .github/workflows/vm-boot-label.yml instead, which calls it below. The
    # job gates on the label being PRESENT, not on the event that added it, so
    # synchronizing an already-labelled pull request validates its new head,
    # not only the commit that was labelled. A label-name `if:` here would
    # leave a skipped `ucore-vm` run as the newest run of that check name and
    # hide an earlier failed run from PR triage.
    types: [opened, synchronize, reopened]
  # Only .github/workflows/vm-boot-label.yml calls this workflow, when the
  # `vm-boot` label goes on a pull request. A called workflow sees the caller's
  # `pull_request` event, so the job `if:` below reads the same payload. It
  # takes no inputs and no secret, because the job uses only `github.token`,
  # which a called workflow receives.
  workflow_call: {}

permissions:
  contents: read

jobs:
  ucore-vm:
    name: Boot uCore with released packaging and checked-out executables
    # ubuntu-26.04 carries Podman 5, whose --imagestore option keeps the
    # composed-image container storage isolated in the job-local private store.
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'vm-boot')
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # e2fsprogs supplies mkfs.ext4 for the read-only fixture disk that carries
      # the shared OCI layout without growing the VM's writable overlay.
      - name: Install QEMU, OVMF, fixture-disk and native build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs libpam0g-dev libsystemd-dev ovmf qemu-system-x86 qemu-utils xz-utils

      - name: Build the checked-out Pilothouse executables
        run: make build

      - name: Verify the private-store tool contract
        run: |
          podman --version
          podman --help | grep -F -- '--imagestore'
          skopeo --version
          cosign version
          test -r /dev/kvm

      - name: Compose, boot, validate and remove the uCore fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo -n env "PATH=$PATH" "GITHUB_TOKEN=$GITHUB_TOKEN" \
            bash test/image/ucore-image-test.sh \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
