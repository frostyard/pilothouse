name: AI fix requested

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue carrying the ai-fix-requested label
        required: true
        type: number

permissions: {}

concurrency:
  group: ai-fix-${{ github.repository_id }}-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign-copilot:
    name: Assign Copilot
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       github.event.label.name == 'ai-fix-requested')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      TARGET_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate request and assign issue
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::COPILOT_ASSIGNMENT_TOKEN is not configured; see docs/ai-fix-workflow.md"
            exit 1
          fi
          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          issue_path="repos/${TARGET_REPOSITORY}/issues/${ISSUE_NUMBER}"
          issue_json="$(
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$issue_path"
          )"

          if jq -e 'has("pull_request")' <<<"$issue_json" >/dev/null; then
            echo "::error::#$ISSUE_NUMBER is a pull request, not an issue"
            exit 1
          fi
          if [[ "$(jq -r '.state' <<<"$issue_json")" != "open" ]]; then
            echo "::error::Issue #$ISSUE_NUMBER is not open"
            exit 1
          fi
          if ! jq -e \
            'any(.labels[]?; .name == "ai-fix-requested")' \
            <<<"$issue_json" >/dev/null; then
            echo "::error::Issue #$ISSUE_NUMBER does not have the ai-fix-requested label"
            exit 1
          fi
          if jq -e \
            'any(.assignees[]?; .login == "copilot-swe-agent" or .login == "copilot-swe-agent[bot]")' \
            <<<"$issue_json" >/dev/null; then
            echo "Issue #$ISSUE_NUMBER is already assigned to Copilot." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_branch="$(gh api "repos/$TARGET_REPOSITORY" --jq '.default_branch')"
          jq -n \
            --arg repository "$TARGET_REPOSITORY" \
            --arg branch "$base_branch" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repository,
                base_branch: $branch
              }
            }' |
            gh api \
              --method POST \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$issue_path/assignees" \
              --input - >/dev/null

          echo "Assigned issue #$ISSUE_NUMBER to Copilot from \`$base_branch\`." >>"$GITHUB_STEP_SUMMARY"
