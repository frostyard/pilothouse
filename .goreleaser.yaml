# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
pro: true

project_name: pilothouse

metadata:
  description: pilothouse - a local web administration console for image-based Linux systems
  homepage: "https://github.com/frostyard/pilothouse"
  license: MIT
  maintainers:
    - "Brian Ketelsen <bketelsen@gmail.com>"

git:
  # Allow non-semver tags for snapshot builds
  ignore_tags:
    - continuous

snapshot:
  # Use a static version template that doesn't require parsing existing tags
  version_template: "{{ .ShortCommit }}-snapshot"

gomod:
  proxy: false

before:
  hooks:
    - go mod tidy
    - go tool templ generate

builds:
  - id: "pilothouse"
    binary: pilothouse
    main: ./cmd/pilothouse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: "pilothoused"
    binary: pilothoused
    main: ./cmd/pilothoused
    # pilothoused links libpam via cgo, so it requires a C toolchain.
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # Cross-compile the arm64 build with the aarch64 toolchain installed in CI.
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CGO_LDFLAGS=-L/usr/lib/aarch64-linux-gnu
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -tags=sdjournal
    ldflags:
      - -s -w

archives:
  - files:
      - README.md
      - LICENSE
      - THIRD_PARTY.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: "^.*feat\\(deps\\)*:+.*$"
      order: 300
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Documentation updates"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: Other work
      order: 9999

nfpms:
  - file_name_template: "{{ .ConventionalFileName }}"
    package_name: frostyard-pilothouse
    description: |-
      A local web administration console for image-based Linux systems, with
      an unprivileged web process and a root-only action broker.
    license: MIT
    formats:
      - deb
      - rpm
    # nFPM's `scripts` key is not per-format, so this one script is wired here,
    # at the top level of the nfpms entry, and runs as both the Debian
    # `postinst` and the RPM `%post`. It creates the `pilothouse` user and
    # group from the shipped sysusers file and repairs the ownership and mode
    # of the configuration directories and env files, which the static
    # owner/group metadata below cannot produce on its own (the payload is
    # extracted before the account exists, and nFPM's DEB tar metadata leaves
    # numeric UID/GID at zero).
    scripts:
      postinstall: ./packaging/postinstall.sh
    # NFPM treats `overrides.<format>.contents` as a full replacement of the
    # base contents list for that format, so each override below is a
    # complete, self-contained list rather than a delta. The two formats
    # differ in their PAM stack (Debian `common-*` includes vs. Fedora
    # `password-auth`) and in the broker unit's `--admin-group` default
    # (`sudo` vs. `wheel`).
    #
    # `dependencies` is likewise per-format. Each list names the DIRECT
    # provider of every runtime requirement, in the same six roles on both
    # platforms: the linked C library, the PAM shared library `pilothoused`
    # links via cgo, the package providing the PAM modules the policy loads
    # (`pam_nologin.so`), the package providing the PAM stacks the policy
    # includes, the libsystemd shared library, and systemd itself.
    #
    # The two configuration directories carry distinct metadata:
    # /etc/pilothouse is group-readable by `pilothouse` so the units'
    # `EnvironmentFile=` reads work, while /etc/pilothouse/storage/credentials
    # holds secrets only the root broker reads and is root-only. Both env
    # files are `type: config` so local edits survive upgrades; each ships
    # with every setting commented out, so installing the package changes no
    # runtime behavior. /run/pilothouse and /var/lib/pilothouse are
    # deliberately NOT packaged — systemd's `RuntimeDirectory=` and
    # `StateDirectory=` own them.
    overrides:
      deb:
        dependencies:
          - libc6
          - libpam0g
          - libpam-modules
          - libpam-runtime
          - libsystemd0
          - systemd
        contents:
          - src: ./packaging/pilothouse.service
            dst: /usr/lib/systemd/system/pilothouse.service
          - src: ./packaging/deb/pilothoused.service
            dst: /usr/lib/systemd/system/pilothoused.service
          - src: ./packaging/pilothouse.pam
            dst: /etc/pam.d/pilothouse
            type: config
          - src: ./packaging/pilothouse.sysusers
            dst: /usr/lib/sysusers.d/pilothouse.conf
          - dst: /etc/pilothouse
            type: dir
            file_info:
              mode: 0750
              owner: root
              group: pilothouse
          - dst: /etc/pilothouse/storage/credentials
            type: dir
            file_info:
              mode: 0700
              owner: root
              group: root
          - src: ./packaging/pilothouse.env
            dst: /etc/pilothouse/pilothouse.env
            type: config
            file_info:
              mode: 0640
              owner: root
              group: pilothouse
          - src: ./packaging/pilothoused.env
            dst: /etc/pilothouse/pilothoused.env
            type: config
            file_info:
              mode: 0640
              owner: root
              group: pilothouse
      rpm:
        dependencies:
          - glibc
          - pam-libs
          - pam
          - authselect-libs
          - systemd-libs
          - systemd
        contents:
          - src: ./packaging/pilothouse.service
            dst: /usr/lib/systemd/system/pilothouse.service
          - src: ./packaging/rpm/pilothoused.service
            dst: /usr/lib/systemd/system/pilothoused.service
          - src: ./packaging/rpm/pilothouse.pam
            dst: /etc/pam.d/pilothouse
            type: config
          - src: ./packaging/pilothouse.sysusers
            dst: /usr/lib/sysusers.d/pilothouse.conf
          - dst: /etc/pilothouse
            type: dir
            file_info:
              mode: 0750
              owner: root
              group: pilothouse
          - dst: /etc/pilothouse/storage/credentials
            type: dir
            file_info:
              mode: 0700
              owner: root
              group: root
          - src: ./packaging/pilothouse.env
            dst: /etc/pilothouse/pilothouse.env
            type: config
            file_info:
              mode: 0640
              owner: root
              group: pilothouse
          - src: ./packaging/pilothoused.env
            dst: /etc/pilothouse/pilothoused.env
            type: config
            file_info:
              mode: 0640
              owner: root
              group: pilothouse

release:
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/frostyard/{{ .ProjectName }}/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    _Released with [GoReleaser Pro](https://goreleaser.com/pro)!_

nightly:
  # Allows you to change the version of the generated nightly release.
  #
  # Note that some pipes require this to be semantic version compliant (nfpm,
  # for example).
  #
  # Default: `{{ incpatch .Version }}-{{ .ShortCommit }}-nightly`.
  # Templates: allowed.
  version_template: "{{ incmajor .Version }}-dev"

  # Tag name to create if publish_release is enabled.
  tag_name: dev

  # Whether to publish a release or not.
  # Only works on GitHub.
  publish_release: true

  # Whether to delete previous pre-releases for the same `tag_name` when
  # releasing.
  # This allows you to keep a single pre-release.
  keep_single_release: true
